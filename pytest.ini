[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

# Markers for different test types
markers =
    unit: Unit tests
    property: Property-based tests
    integration: Integration tests
    slow: Slow running tests

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    
# Logging
log_cli = false
log_cli_level = INFO
